<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Emerald rounded square (matches Navbar brand color) -->
  <rect width="64" height="64" rx="14" fill="#059669"/>
  
  <!-- Subtle grid lines (GRID brand identity) -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="21" y1="0" x2="21" y2="64"/>
    <line x1="43" y1="0" x2="43" y2="64"/>
    <line x1="0" y1="21" x2="64" y2="21"/>
    <line x1="0" y1="43" x2="64" y2="43"/>
  </g>

  <!-- Professional music note (matches Navbar icon style) -->
  <g fill="#ffffff">
    <!-- Note head -->
    <ellipse cx="28" cy="44" rx="8" ry="6" transform="rotate(-20 28 44)"/>
    <!-- Note stem -->
    <rect x="34" y="16" width="3" height="28" rx="1.5"/>
